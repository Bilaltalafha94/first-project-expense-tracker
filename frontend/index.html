<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Expense Tracker</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="mb-4">Expense Tracker</h1>

    <div class="row g-3" id="summary-cards"></div>

    <div id="alert-container"></div>

    <div class="card mt-4">
      <div class="card-header">
        <h2 class="h5 mb-0">Add Expense</h2>
      </div>

      <div class="card-body" id="expense-form-container">
        <form id="expense-form">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" required>
          </div>

          <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" class="form-control" id="amount" name="amount" min="0.01" step="0.01" required>
          </div>

          <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" name="category" required>
              <option value="">Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>

          <button type="submit" class="btn btn-primary">Add Expense</button>
        </form>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header">
        <h2 class="h5 mb-0">Expenses</h2>
      </div>

      <div class="card-body">
        <div class="mb-3">
          <label for="category-filter" class="form-label">Filter by Category</label>
          <select id="category-filter" class="form-select">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>

          <div id="loading-spinner" class="text-center my-3 d-none">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>

        <div id="expenses-table-container">
          <div class="table-responsive">
            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Amount</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expenses-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editExpenseModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form id="edit-expense-form">
            <label for="edit-title" class="form-label">Title</label>
            <input type="text" id="edit-title" class="form-control" required>

            <label for="edit-amount" class="form-label mt-2">Amount</label>
            <input type="number" id="edit-amount" class="form-control" min="0.01" step="0.01" required>

            <label for="edit-category" class="form-label mt-2">Category</label>
            <select id="edit-category" class="form-select" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>

            <label for="edit-date" class="form-label mt-2">Date</label>
            <input type="date" id="edit-date" class="form-control" required>

            <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
